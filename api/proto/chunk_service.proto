syntax = "proto3";

package dfms.chunk.v1;

option go_package = "github.com/AnirudhSinghRajora/DFMS/api/proto/chunkpb";

// ChunkService handles all raw byte operations: chunking, deduplication,
// and MinIO storage. The API Gateway delegates storage concerns here
// via gRPC streaming, keeping a clean separation between metadata (gateway)
// and data (chunk service).
service ChunkService {
  // UploadFile accepts a file stream, splits it into CDC chunks,
  // deduplicates, and uploads new chunks to MinIO.
  // Client-streaming: first message = metadata, subsequent = raw bytes.
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  // DownloadFile fetches chunks from MinIO in order and streams them back.
  // Server-streaming: service sends ordered byte frames to the client.
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);

  // DeleteChunks removes chunks from MinIO if their ref_count has reached 0.
  rpc DeleteChunks(DeleteChunksRequest) returns (DeleteChunksResponse);

  // Health returns the service health status.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// ── Upload Messages ──────────────────────────────────────────

message UploadFileRequest {
  oneof data {
    // First message in the stream: file metadata.
    UploadMetadata metadata = 1;
    // Subsequent messages: raw file bytes (64KB frames).
    bytes chunk_data = 2;
  }
}

message UploadMetadata {
  string file_name = 1;
  string user_id = 2;
  string mime_type = 3;
}

message UploadFileResponse {
  string file_checksum = 1;    // SHA-256 of the entire file
  int64 total_size = 2;        // Total file size in bytes
  int32 chunk_count = 3;       // Number of chunks produced
  int32 new_chunks = 4;        // Chunks that were actually new (not deduped)
  int32 dedup_chunks = 5;      // Chunks that already existed (dedup hits)
  repeated ChunkInfo chunks = 6;
}

message ChunkInfo {
  string hash = 1;             // SHA-256 hex of chunk content
  int64 size = 2;              // Chunk size in bytes
  int32 index = 3;             // Position in file (0-based)
  bool is_duplicate = 4;       // True if this chunk already existed
}

// ── Download Messages ────────────────────────────────────────

message DownloadFileRequest {
  repeated string chunk_hashes = 1; // Ordered list of chunk hashes (the manifest)
}

message DownloadFileResponse {
  bytes data = 1;              // Raw chunk bytes (streamed in order)
  string chunk_hash = 2;      // Hash of the chunk being sent
  int32 chunk_index = 3;      // Index in the manifest
}

// ── Delete Messages ──────────────────────────────────────────

message DeleteChunksRequest {
  repeated string chunk_hashes = 1; // Chunk hashes to delete from MinIO
}

message DeleteChunksResponse {
  int32 deleted_count = 1;     // Number of chunks actually removed from storage
  int32 failed_count = 2;      // Number of chunks that failed to delete
}

// ── Health Messages ──────────────────────────────────────────

message HealthRequest {}

message HealthResponse {
  string status = 1;           // "healthy" or "unhealthy"
  bool minio_connected = 2;
  string version = 3;
}

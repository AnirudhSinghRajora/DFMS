# ──────────────────────────────────────────────────────────────
# DFMS CLI Release Pipeline
#
# Triggers: push of a v* tag (e.g. v1.0.0, v0.2.1-rc1).
# Produces: cross-platform dfmsctl binaries, checksums, shell
#           completions, man pages — published as a GitHub Release.
#
# CI (lint + test) runs on every push/PR; this workflow only
# runs on tags, so it does NOT duplicate those checks.
# ──────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create GitHub Releases

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: Release dfmsctl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -race -timeout 120s ./internal/cli/ ./internal/dfmsclient/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify go install
        run: |
          # Confirm the tagged module is installable. This uses the local
          # checkout (not the registry) so it works before proxy indexing.
          go install ./cmd/dfmsctl/
          dfmsctl version

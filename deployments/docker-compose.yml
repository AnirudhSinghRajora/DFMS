services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dfms-postgres
    environment:
      POSTGRES_USER: dfms
      POSTGRES_PASSWORD: dfms_dev_password
      POSTGRES_DB: dfms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfms"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dfms-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (Single node, 4 drives for erasure coding) ────
  # MinIO requires minimum 4 drives for erasure coding.
  # In dev we simulate this with 4 volume mounts on a single node.
  minio:
    image: quay.io/minio/minio:latest
    container_name: dfms-minio
    command: server /data/drive{1...4} --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data1:/data/drive1
      - minio_data2:/data/drive2
      - minio_data3:/data/drive3
      - minio_data4:/data/drive4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO Bucket Initialization ─────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: dfms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dfms http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing dfms/chunks;
      mc mb --ignore-existing dfms/temp-uploads;
      echo '✅ MinIO buckets initialized: chunks, temp-uploads';
      "
    restart: "no"

  # ─── Kafka (Official Apache image, KRaft mode) ───────────
  # Using apache/kafka-native — GraalVM-compiled native binary.
  # Advantages: <0.2s startup, ~60MB RAM, free, official Apache image.
  # KRaft is the only mode in Kafka 4.x (ZooKeeper removed).
  # Env var format: KAFKA_* (NOT KAFKA_CFG_* — that was bitnami-specific).
  # Docs: https://hub.docker.com/r/apache/kafka-native
  kafka:
    image: apache/kafka-native:latest
    container_name: dfms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    # Note: No persistent volume for Kafka in dev — data is ephemeral.
    # Docker named volumes are created as root, but kafka-native runs as
    # appuser (uid 1000) causing AccessDeniedException. Kafka data (events)
    # doesn't need to survive container recreation in development.
    healthcheck:
      # kafka-native has NO CLI tools (no kafka-broker-api-versions.sh).
      # Check for meta.properties — Kafka only creates this after full init.
      test: ["CMD-SHELL", "test -f /tmp/kafka-logs/meta.properties"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # ─── Kafka Topic Initialization ──────────────────────────
  # kafka-native does NOT include CLI tools — we use the JVM-based
  # apache/kafka image (which has kafka-topics.sh) as an init container.
  kafka-init:
    image: apache/kafka:latest
    container_name: dfms-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic dfms.chunks.created --partitions 6 --replication-factor 1 --bootstrap-server kafka:19092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic dfms.chunks.deleted --partitions 3 --replication-factor 1 --bootstrap-server kafka:19092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic dfms.nodes.health   --partitions 3 --replication-factor 1 --bootstrap-server kafka:19092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic dfms.files.deleted  --partitions 6 --replication-factor 1 --bootstrap-server kafka:19092;
      echo '✅ Kafka topics created.';
      "
    restart: "no"

  # ─── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: dfms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ─── OpenTelemetry Collector ─────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: dfms-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ../configs/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  # ─── Grafana Tempo (Trace Storage) ──────────────────────
  tempo:
    image: grafana/tempo:latest
    container_name: dfms-tempo
    ports:
      - "3200:3200"   # HTTP API
      - "9095:9095"   # gRPC
    volumes:
      - ../configs/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: dfms-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  pgdata:
  minio_data1:
  minio_data2:
  minio_data3:
  minio_data4:
  prometheus_data:
  tempo_data:
  grafana_data:


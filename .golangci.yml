run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gocritic
    - revive
    - bodyclose
    - noctx
    - prealloc

linters-settings:
  govet:
    enable:
      - shadow
  goimports:
    local-prefixes: github.com/AnirudhSinghRajora/DFMS
  revive:
    rules:
      - name: exported
        severity: warning
      - name: unexported-return
        severity: warning
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
    - path: cmd/
      linters:
        - gocritic
  max-issues-per-linter: 50
  max-same-issues: 5

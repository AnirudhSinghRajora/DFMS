global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "dfms-api-gateway"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  - job_name: "dfms-chunk-service"
    static_configs:
      - targets: ["host.docker.internal:9191"]
    metrics_path: /metrics

  - job_name: "dfms-replication-manager"
    static_configs:
      - targets: ["host.docker.internal:9291"]
    metrics_path: /metrics

  - job_name: "dfms-health-monitor"
    static_configs:
      - targets: ["host.docker.internal:9391"]
    metrics_path: /metrics

  - job_name: "dfms-gc-worker"
    static_configs:
      - targets: ["host.docker.internal:9491"]
    metrics_path: /metrics
